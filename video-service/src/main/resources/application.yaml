server:
  port: 8082
spring:
  application:
    name: video-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerialization
      value-serializer: org.springframework.kafka.support.serialization.JsonSerialization
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

# AWS Configuration
aws:
  access-key: ${AWS_ACCESS_KEY:your-access-key}
  secret-key: ${AWS_SECRET_KEY:your-secret-key}
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket-name: ${AWS_BUCKET_NAME:abcdbucket}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info